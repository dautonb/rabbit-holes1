name: Quirky Internet Agent

on:
  schedule:
    # Lịch chạy mỗi ngày 3 lần (vào lúc 0:00, 8:00 và 16:00 giờ UTC)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thử thủ công bất cứ lúc nào trên GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Agent Script
        run: |
          python agent.py
